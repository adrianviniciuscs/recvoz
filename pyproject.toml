[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recvoz"
version = "0.1.0"
description = "Reconhecimento de locutor: avaliação Python e firmware ESP32-S3"
requires-python = ">=3.11"
dependencies = [
  "librosa==1.0.0", "numpy>=1.24", "scipy>=1.11", "soundfile>=0.12",
  "scikit-learn>=1.3", "matplotlib>=3.7",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4"]
collect = ["pyserial>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]
